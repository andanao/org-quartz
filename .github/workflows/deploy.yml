name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout personal org-roam
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/org
          path: org-source
          token: ${{ secrets.ORG_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox

      - name: Install dependencies
        run: npm ci

      - name: Update paths for CI
        run: |
          sed -i 's|Path.home() / "git/org/personal"|Path("org-source/personal")|' filter.py

      - name: Build site
        run: |
          python3 filter.py personal
          npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
