name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout org-quartz
        uses: actions/checkout@v4

      - name: Checkout personal org-roam
        uses: actions/checkout@v4
        with:
          repository: andanao/org-roam
          path: org-source
          token: ${{ secrets.ORG_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox

      - name: Install dependencies
        run: npm install

      - name: Update paths for CI
        run: |
          # Point to checked-out org repo (org-roam repo = personal folder)
          sed -i 's|Path.home() / "git/org/personal"|Path(__file__).parent / "org-source"|' filter.py

      - name: Filter and build
        run: |
          python3 filter.py personal
          npx quartz build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
